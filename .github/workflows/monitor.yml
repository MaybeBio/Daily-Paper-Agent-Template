name: literature-monitor

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch: {}

# Serialize runs (don't cancel an in-flight run): a queued run waits instead of
# racing the running one for the same branch.
concurrency:
  group: literature-monitor
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: monitor + agent + site
        run: |
          python scripts/monitor.py --config config.yaml --out-dir . --issue-body /tmp/issue.md --issue-title /tmp/issue.title
          python scripts/build_site.py --out-dir . --config config.yaml
        env:
          ENTREZ_EMAIL: ${{ secrets.ENTREZ_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "monitor: capture $(date +%F)" || echo "no changes"
          # main may have advanced (manual push / another run) since checkout;
          # rebase our commit on top before pushing so the push is a fast-forward.
          git pull --rebase --autostash
          git push
      - name: open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/issue.md ]; then
            gh issue create --title "$(cat /tmp/issue.title)" --body-file /tmp/issue.md || true
          fi
