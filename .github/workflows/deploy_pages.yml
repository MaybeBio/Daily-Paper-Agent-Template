name: deploy-pages

on:
  workflow_run:
    workflows: ["literature-monitor"]
    types:
      - completed
  # site/ is gitignored and rebuilt below, so a manual backfill push never fires
  # a workflow_run. This is how you deploy after one.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    # `workflow_run` is null on a manual dispatch, so testing it alone would
    # silently skip the job instead of deploying.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # site/ is not committed — rebuild it from Archive/ before publishing.
      - run: pip install -r requirements.txt
      - run: python scripts/build_site.py --out-dir . --config config.yaml
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "site"
      - id: deployment
        uses: actions/deploy-pages@v5
